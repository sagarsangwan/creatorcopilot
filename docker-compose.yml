

services:
  db-analytics:
    image: mysql:8.0
    restart: always
    env_file:
      - ./.env.analytics.db
    ports:
    - "3309:3306"
    volumes:
      - analytics_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10
    
    networks:
      - microservice-network
  db-auth:
    image: postgres:15-alpine 
    restart: always
    env_file:
      - ./.env.auth.db
    volumes:
    - auth_postgres_data:/var/lib/postgresql/data/
    ports:
    - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_service_user -d fastapi_auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network
  db-content:
    image: postgres:15-alpine 
    restart: always
    env_file:
      - ./.env.content.db
    volumes:
    - content_postgres_data:/var/lib/postgresql/data/
    ports:
    - "55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_service_user -d fastapi_content_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network
  
  # db-media:
  #   image: postgres:15-alpine
  #   restart: always
  #   env_file:
  #     - ./.env.media.db
  #   volumes:
  #     - media_postgres_data:/var/lib/postgresql/data/
  #   ports:
  #   - "55434:5432"  
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U media_service_user -d fastapi_media_db"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - microservice-network


  #django i am using as gateway
  
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
    - "8000:8000"
    env_file:
      - ./gateway/.env
    volumes:
      - ./gateway:/app
    networks:
      - microservice-network
    environment:
      - PYTHONUNBUFFERED=1
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile : Dockerfile
    ports:
      - "8005:8005"
    volumes:
      - ./services/analytics-service/:/app
    env_file:
      - ./services/analytics-service/.env
    environment:
      - FLASK_DEBUG=True
      - FLASK_APP=app.main
      - CHOKIDAR_USEPOLLING=true 
      - WATCHDOG_USEPOLLING=true
    depends_on:
      db-analytics:
        condition: service_healthy
    networks:
      - microservice-network
    

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    depends_on:
      db-auth:
        condition: service_healthy
    ports:
      - "8001:8001" # Host port:Container port
    env_file:
      - ./services/auth-service/.env
    volumes:
      - ./services/auth-service:/app 
        
    networks:
      - microservice-network
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    env_file:
      - ./services/analytics-service/.env
    volumes:
      - ./services/ai-service:/app 
        
    networks:
      - microservice-network
    
  # media-service:
  #   build:
  #     context: ./services/media-service
  #     dockerfile: Dockerfile
  #   depends_on:
  #     db-media:
  #       condition: service_healthy
  #   ports:
  #     - "8002:8002"
  #   volumes:
  #     - ./services/media-service:/app
  #   networks:
  #     - microservice-network
  content-service:
    build:
      context: ./services/content-service
      dockerfile: Dockerfile
    depends_on:
      db-content:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8003:8003"
    env_file:
    - ./services/content-service/.env
    volumes:
      - ./services/content-service:/app
    networks:
      - microservice-network
        
  content-worker:
    build:
      context: ./services/content-service
      dockerfile: Dockerfile
    depends_on:
      db-content:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.celery_app.celery worker -l info
    env_file:
      - ./services/content-service/.env
    volumes:
      - ./services/content-service:/app
    networks:
      - microservice-network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"   # optional; remove in prod
    networks:
      - microservice-network
  


networks:
  microservice-network:
    driver: bridge # This creates the shared network for inter-service communication
volumes:
  auth_postgres_data:
  media_postgres_data:
  content_postgres_data:
  analytics_mysql_data: